# Check obrigatório dos PRs para a main (regra do ruleset: status "pr-check").
# Valida o bundle contra HML autenticando como sp-lab-deploy, com as
# credenciais do environment "hml" do GitHub.
name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: pr-check   # precisa bater com o nome exigido na regra da main
    runs-on: ubuntu-latest
    environment: hml
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: bundles/vendas
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validar bundle (hml)
        run: databricks bundle validate -t hml
